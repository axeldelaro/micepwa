<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="VoxelCraft Ultimate — Sandbox 3D Photo-HD & Multijoueur P2P."
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>VoxelCraft Ultimate</title>
    <style>
      :root {
        --bg-dark: rgba(11, 16, 26, 0.88);
        --bg-panel: rgba(17, 24, 39, 0.96);
        --bg-slot: rgba(12, 17, 27, 0.9);
        --border-voxel: #3b4b66;
        --border-bright: #34d399;
        --accent: #22c55e;
        --accent-blue: #38bdf8;
        --accent-amber: #f59e0b;
        --danger: #ef4444;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --slot-size: 46px;
        --hotbar-slot: clamp(31px, 8.2vw, 46px);
      }

      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090d16;
        color: var(--text-main);
        font-family: var(--font-ui);
        touch-action: none;
      }

      #game-canvas-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 1;
      }

      #game-canvas-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      #underwater-tint {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        background: radial-gradient(circle, rgba(14, 116, 190, 0.34) 0%, rgba(7, 55, 110, 0.68) 100%);
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      #damage-flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        background: radial-gradient(circle, rgba(239, 68, 68, 0.08) 35%, rgba(220, 38, 38, 0.55) 100%);
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      #ui-root {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      .ui-interactive {
        pointer-events: auto;
      }

      .voxel-btn {
        appearance: none;
        background: linear-gradient(180deg, #28354d 0%, #1a2436 100%);
        color: var(--text-main);
        border: 1.5px solid #475978;
        border-bottom-width: 3px;
        border-radius: 8px;
        padding: 8px 13px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.08s ease, filter 0.12s ease, border-color 0.12s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }

      .voxel-btn:hover,
      .voxel-btn.gp-hover {
        filter: brightness(1.14);
        border-color: var(--border-bright);
      }

      .voxel-btn:active {
        transform: scale(0.96);
      }

      .voxel-btn.primary {
        background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
        border-color: #86efac;
        border-bottom-color: #14532d;
        color: #032612;
      }

      .voxel-btn.blue {
        background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
        border-color: #bae6fd;
        border-bottom-color: #075985;
        color: #041e30;
      }

      .voxel-btn.amber {
        background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
        border-color: #fde68a;
        border-bottom-color: #92400e;
        color: #271300;
      }

      .voxel-btn.danger {
        background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
        border-color: #fca5a5;
        border-bottom-color: #7f1d1d;
        color: #fff;
      }

      .hud-pill {
        appearance: none;
        background: rgba(12, 18, 30, 0.76);
        backdrop-filter: blur(6px);
        color: #f8fafc;
        border: 1.5px solid rgba(148, 163, 184, 0.42);
        border-radius: 10px;
        min-width: 38px;
        height: 36px;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
      }

      .hud-pill:active {
        transform: scale(0.93);
        border-color: #38bdf8;
      }

      .voxel-input,
      .voxel-select {
        user-select: text;
        -webkit-user-select: text;
        background: rgba(9, 13, 22, 0.92);
        border: 1.5px solid #3b4b66;
        border-radius: 8px;
        color: var(--text-main);
        padding: 9px 11px;
        font-size: 15px;
        outline: none;
        min-width: 0;
      }

      .voxel-input:focus,
      .voxel-select:focus {
        border-color: var(--accent-blue);
      }

      input[type="range"] {
        width: 100%;
        height: 24px;
        accent-color: #22c55e;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(5, 9, 16, 0.76);
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
        pointer-events: auto;
        padding: calc(8px + var(--safe-top)) calc(8px + var(--safe-right))
          calc(8px + var(--safe-bottom)) calc(8px + var(--safe-left));
      }

      .modal-card {
        background: var(--bg-panel);
        border: 1.5px solid #4b5e80;
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.72);
        border-radius: 14px;
        padding: 14px 16px;
        width: 100%;
        max-width: 720px;
        max-height: calc(100dvh - 20px - var(--safe-top) - var(--safe-bottom));
        overflow-y: auto;
        overflow-x: hidden;
        color: var(--text-main);
      }

      .slot-box {
        width: var(--slot-size);
        height: var(--slot-size);
        background: var(--bg-slot);
        border: 1.5px solid #38465e;
        border-radius: 7px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .slot-box.hotbar-slot {
        width: var(--hotbar-slot);
        height: var(--hotbar-slot);
      }

      .slot-box:hover,
      .slot-box.gp-hover {
        border-color: #5eead4;
        background: rgba(34, 52, 78, 0.92);
      }

      .slot-box.selected {
        border-color: #facc15;
        box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.48);
      }

      .slot-box img {
        width: 72%;
        height: 72%;
        image-rendering: pixelated;
        pointer-events: none;
      }

      .slot-count {
        position: absolute;
        right: 2px;
        bottom: 1px;
        font-size: 11px;
        font-weight: 800;
        color: #fff;
        text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
        pointer-events: none;
      }

      .slot-durability {
        position: absolute;
        left: 3px;
        right: 3px;
        bottom: 2px;
        height: 3px;
        background: #1e293b;
        pointer-events: none;
      }

      .slot-durability > span {
        display: block;
        height: 100%;
        background: #22c55e;
      }

      .inv-grid-9 {
        display: grid;
        grid-template-columns: repeat(9, var(--slot-size));
        gap: 4px;
        justify-content: center;
      }

      /* Mobile & Compact Viewport Adaptations (Portrait & Landscape Phones) */
      @media (max-width: 768px), (max-height: 500px) {
        :root {
          --slot-size: clamp(29px, min(9.4vw, 10.5vh), 40px);
          --hotbar-slot: clamp(29px, min(8.3vw, 11vh), 40px);
        }

        .hud-pill .pill-text {
          display: none;
        }

        .hud-pill {
          padding: 0 8px;
          min-width: 36px;
          height: 34px;
          font-size: 15px;
        }

        .modal-card {
          padding: 10px 12px;
          border-radius: 12px;
        }

        .voxel-btn {
          padding: 7px 11px;
          font-size: 12px;
        }
      }

      #gamepad-virtual-cursor {
        position: fixed;
        width: 22px;
        height: 22px;
        margin-left: -11px;
        margin-top: -11px;
        border-radius: 50%;
        border: 3px solid #facc15;
        background: rgba(56, 189, 248, 0.45);
        box-shadow: 0 0 12px rgba(250, 204, 21, 0.9);
        pointer-events: none;
        z-index: 9999;
        display: none;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 14, 24, 0.5);
      }
      ::-webkit-scrollbar-thumb {
        background: #3b4b66;
        border-radius: 4px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BcqEjCXZ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-BkwEjBYS.js">
    <link rel="modulepreload" crossorigin href="./assets/network-DCbn0IS-.js">
  </head>
  <body>
    <div id="game-canvas-container"></div>
    <div id="underwater-tint"></div>
    <div id="damage-flash"></div>
    <div id="ui-root"></div>
    <div id="gamepad-virtual-cursor"></div>
  </body>
</html>
