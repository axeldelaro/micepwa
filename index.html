<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#38a169" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="VoxelCraft Online — Jeu bac à sable voxel 3D infini, double moteur graphique (Classique & Shaders PBR), contrôles hybrides et multijoueur WebRTC P2P sans serveur sur GitHub Pages."
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>VoxelCraft Online — Sandbox 3D P2P</title>
    <style>
      :root {
        --bg-dark: rgba(11, 16, 26, 0.9);
        --bg-panel: rgba(20, 28, 42, 0.95);
        --bg-slot: rgba(12, 17, 27, 0.88);
        --border-voxel: #3b4b66;
        --border-bright: #5eead4;
        --accent: #22c55e;
        --accent-hover: #16a34a;
        --accent-blue: #38bdf8;
        --accent-amber: #f59e0b;
        --danger: #ef4444;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --font-ui: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, monospace;
      }

      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090d16;
        color: var(--text-main);
        font-family: var(--font-ui);
        touch-action: none;
      }

      #game-canvas-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }

      #game-canvas-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      #underwater-tint {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        background: radial-gradient(circle, rgba(14, 116, 190, 0.34) 0%, rgba(7, 55, 110, 0.68) 100%);
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      #damage-flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        background: radial-gradient(circle, rgba(239, 68, 68, 0.08) 35%, rgba(220, 38, 38, 0.55) 100%);
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      #ui-root {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      .ui-interactive {
        pointer-events: auto;
      }

      .voxel-btn {
        appearance: none;
        background: linear-gradient(180deg, #2b3952 0%, #1d283a 100%);
        color: var(--text-main);
        border: 2px solid #475978;
        border-bottom-width: 4px;
        border-radius: 6px;
        padding: 9px 15px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: transform 0.08s ease, filter 0.12s ease, border-color 0.12s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .voxel-btn:hover,
      .voxel-btn.gp-hover {
        filter: brightness(1.14);
        border-color: var(--border-bright);
      }

      .voxel-btn:active {
        transform: translateY(2px);
        border-bottom-width: 2px;
      }

      .voxel-btn.primary {
        background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
        border-color: #86efac;
        border-bottom-color: #14532d;
        color: #042f16;
      }

      .voxel-btn.blue {
        background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
        border-color: #bae6fd;
        border-bottom-color: #075985;
        color: #041e30;
      }

      .voxel-btn.amber {
        background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
        border-color: #fde68a;
        border-bottom-color: #92400e;
        color: #271300;
      }

      .voxel-btn.danger {
        background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
        border-color: #fca5a5;
        border-bottom-color: #7f1d1d;
        color: #fff;
      }

      .voxel-input,
      .voxel-select {
        user-select: text;
        -webkit-user-select: text;
        background: rgba(9, 13, 22, 0.92);
        border: 2px solid #3b4b66;
        border-radius: 6px;
        color: var(--text-main);
        padding: 9px 12px;
        font-size: 14px;
        outline: none;
      }

      .voxel-input:focus,
      .voxel-select:focus {
        border-color: var(--accent-blue);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(5, 9, 16, 0.72);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
        pointer-events: auto;
        padding: 12px;
      }

      .modal-card {
        background: var(--bg-panel);
        border: 2px solid #4b5e80;
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.7);
        border-radius: 10px;
        padding: 18px 20px;
        max-width: 94vw;
        max-height: 92vh;
        overflow-y: auto;
        color: var(--text-main);
      }

      .slot-box {
        width: 48px;
        height: 48px;
        background: var(--bg-slot);
        border: 2px solid #38465e;
        border-radius: 6px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: border-color 0.08s ease, background 0.08s ease;
      }

      .slot-box:hover,
      .slot-box.gp-hover {
        border-color: #5eead4;
        background: rgba(34, 52, 78, 0.92);
      }

      .slot-box.selected {
        border-color: #facc15;
        box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.45);
      }

      .slot-box img {
        width: 34px;
        height: 34px;
        image-rendering: pixelated;
        pointer-events: none;
      }

      .slot-count {
        position: absolute;
        right: 3px;
        bottom: 1px;
        font-size: 12px;
        font-weight: 800;
        color: #fff;
        text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
        pointer-events: none;
      }

      .slot-durability {
        position: absolute;
        left: 4px;
        right: 4px;
        bottom: 3px;
        height: 3px;
        background: #1e293b;
        pointer-events: none;
      }

      .slot-durability > span {
        display: block;
        height: 100%;
        background: #22c55e;
      }

      #gamepad-virtual-cursor {
        position: fixed;
        width: 22px;
        height: 22px;
        margin-left: -11px;
        margin-top: -11px;
        border-radius: 50%;
        border: 3px solid #facc15;
        background: rgba(56, 189, 248, 0.45);
        box-shadow: 0 0 12px rgba(250, 204, 21, 0.9);
        pointer-events: none;
        z-index: 9999;
        display: none;
      }

      /* Scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 14, 24, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: #3b4b66;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="game-canvas-container"></div>
    <div id="underwater-tint"></div>
    <div id="damage-flash"></div>
    <div id="ui-root"></div>
    <div id="gamepad-virtual-cursor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
